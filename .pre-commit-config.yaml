exclude: 'node_modules|.git'
default_stages: [pre-commit]
fail_fast: false


repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        files: "misc_helper.*"
        exclude: ".*json$|.*txt$|.*csv|.*md|.*svg"
      - id: check-merge-conflict
      - id: check-ast
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.10
    hooks:
      - id: ruff
        name: "Run ruff import sorter"
        args: ["--select=I", "--fix"]

      - id: ruff
        name: "Run ruff linter"

      - id: ruff-format
        name: "Run ruff formatter"

  # Biome replaces the boilerplate prettier + eslint hooks: three formatters over the same
  # JS could never all be satisfied, and both of those reformatted the vendored minified
  # libraries. Biome is the only JS tool here, and biome.json owns which files it reads.
  - repo: https://github.com/biomejs/pre-commit
    rev: v2.3.14
    hooks:
      - id: biome-check
        additional_dependencies: ["@biomejs/biome@2.3.14"]
        types_or: [javascript]
        # Vendored builds we do not author; keep in step with biome.json's includes.
        exclude: |
            (?x)^(
                misc_helper/public/dist/.*|
                .*node_modules.*|
                .*boilerplate.*|
                misc_helper/templates/includes/.*|
                misc_helper/public/js/lib/.*|
                misc_helper/public/js/alpine\.min\.js|
                misc_helper/public/js/socket\.io\.min\.js
            )$

ci:
    autoupdate_schedule: weekly
    skip: []
    submodules: false
